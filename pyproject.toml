[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openshelf"
dynamic = ["version"]
description = "Tools for OpenShelf: connectable, LLM-maintained knowledge bases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
test = ["pytest>=8", "mcp>=2.3"]

[project.scripts]
openshelf = "openshelf.cli:main"

[tool.hatch.version]
path = "src/openshelf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openshelf"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "openshelf/schemas"
